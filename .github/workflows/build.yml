name: Build Flutter App

on:
  #push:
  #  branches: [main, master]
  #pull_request:
  #  branches: [main, master]
  workflow_dispatch:
    inputs:
      upgrade_lock:
        description: 'Upgrade flutter_webrtc to latest SHA before building'
        type: boolean
        default: false

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version label
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          if [[ ! "$PUBSPEC_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Failed to parse semantic version from pubspec.yaml: '$PUBSPEC_VERSION'" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          # Increment patch for each workflow run and each rerun attempt.
          AUTO_PATCH=$((PATCH + GITHUB_RUN_NUMBER + GITHUB_RUN_ATTEMPT - 1))
          echo "label=${MAJOR}.${MINOR}.${AUTO_PATCH}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'   # pinned
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          if [ "${{ inputs.upgrade_lock }}" = "true" ]; then
            flutter pub upgrade flutter_webrtc
          else
            flutter pub get
          fi

      - name: Build Web (release)
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ steps.version.outputs.label }}
          path: build/web/
          retention-days: 14

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version label
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          if [[ ! "$PUBSPEC_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Failed to parse semantic version from pubspec.yaml: '$PUBSPEC_VERSION'" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          # Increment patch for each workflow run and each rerun attempt.
          AUTO_PATCH=$((PATCH + GITHUB_RUN_NUMBER + GITHUB_RUN_ATTEMPT - 1))
          AUTO_VERSION="${MAJOR}.${MINOR}.${AUTO_PATCH}"
          echo "label=$AUTO_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$AUTO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl git \
            libgtk-3-dev libblkid-dev \
            liblzma-dev libstdc++-12-dev \
            ninja-build pkg-config \
            libglib2.0-dev libwebkit2gtk-4.1-dev \
            libpulse-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'   # pinned
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: |
          if [ "${{ inputs.upgrade_lock }}" = "true" ]; then
            flutter pub upgrade flutter_webrtc
          else
            flutter pub get
          fi

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ steps.version.outputs.label }}
          path: build/linux/x64/release/bundle/
          retention-days: 14

      - name: Build Debian package (.deb)
        id: deb
        run: |
          APP_DIR_NAME="fluttering_ermine"
          PACKAGE_NAME="fluttering-ermine"
          PACKAGE_VERSION="${{ steps.version.outputs.package_version }}"

          DEB_ROOT="build/linux/deb"
          DEB_OUTPUT="build/linux/${PACKAGE_NAME}_${PACKAGE_VERSION}_amd64.deb"

          rm -rf "$DEB_ROOT"
          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/opt/$APP_DIR_NAME"
          mkdir -p "$DEB_ROOT/usr/share/applications"

          cp -r build/linux/x64/release/bundle/* "$DEB_ROOT/opt/$APP_DIR_NAME/"

          cat > "$DEB_ROOT/DEBIAN/control" <<EOF
          Package: $PACKAGE_NAME
          Version: $PACKAGE_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: fluttering_ermine maintainers
          Depends: libgtk-3-0, libglib2.0-0, libwebkit2gtk-4.1-0, libpulse0
          Description: Fluttering Ermine desktop application
          EOF

          cat > "$DEB_ROOT/usr/share/applications/${PACKAGE_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Fluttering Ermine
          Exec=/opt/$APP_DIR_NAME/$APP_DIR_NAME
          Terminal=false
          Categories=Network;Chat;
          EOF

          chmod 0755 "$DEB_ROOT/opt/$APP_DIR_NAME/$APP_DIR_NAME"
          dpkg-deb --build --root-owner-group "$DEB_ROOT" "$DEB_OUTPUT"

          echo "deb_path=$DEB_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ steps.version.outputs.label }}
          path: ${{ steps.deb.outputs.deb_path }}
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version label
        id: version
        shell: bash
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          if [[ ! "$PUBSPEC_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Failed to parse semantic version from pubspec.yaml: '$PUBSPEC_VERSION'" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          # Increment patch for each workflow run and each rerun attempt.
          AUTO_PATCH=$((PATCH + GITHUB_RUN_NUMBER + GITHUB_RUN_ATTEMPT - 1))
          echo "label=${MAJOR}.${MINOR}.${AUTO_PATCH}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'   # pinned
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        shell: bash                    # fixed: use bash so the if/else works
        run: |
          if [ "${{ inputs.upgrade_lock }}" = "true" ]; then
            flutter pub upgrade flutter_webrtc
          else
            flutter pub get
          fi

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ steps.version.outputs.label }}
          path: build/windows/x64/runner/Release/
          retention-days: 14

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version label
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          if [[ ! "$PUBSPEC_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Failed to parse semantic version from pubspec.yaml: '$PUBSPEC_VERSION'" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          # Increment patch for each workflow run and each rerun attempt.
          AUTO_PATCH=$((PATCH + GITHUB_RUN_NUMBER + GITHUB_RUN_ATTEMPT - 1))
          echo "label=${MAJOR}.${MINOR}.${AUTO_PATCH}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'   # pinned
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Debug APK — no signing key required.
      # To build a signed release APK, create a keystore, add the following
      # secrets to your repo, and replace the step below:
      #   ANDROID_KEYSTORE_BASE64  — base64-encoded .jks file
      #   ANDROID_KEY_ALIAS        — key alias
      #   ANDROID_KEY_PASSWORD     — key password
      #   ANDROID_STORE_PASSWORD   — store password
      #
      # Then decode the keystore and pass the signing config via:
      #   flutter build apk --release \
      #     --dart-define=KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks \
      #     ... (or configure key.properties in android/)
      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ steps.version.outputs.label }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
