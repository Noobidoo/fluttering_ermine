name: Build Flutter App

on:
  #push:
  #  branches: [main, master]
  #pull_request:
  #  branches: [main, master]
  workflow_dispatch:
    inputs:
      upgrade_lock:
        description: 'Upgrade flutter_webrtc to latest SHA before building'
        type: boolean
        default: false

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version label
        id: version
        run: |
          TAG=$(git tag --points-at HEAD | head -n1)
          if [ -n "$TAG" ]; then
            echo "label=$TAG" >> "$GITHUB_OUTPUT"
          else
            PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
            echo "label=${PUBSPEC_VERSION}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          if [ "${{ inputs.upgrade_lock }}" = "true" ]; then
            flutter pub upgrade flutter_webrtc
          else
            flutter pub get
          fi

      - name: Build Web (release)
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ steps.version.outputs.label }}
          path: build/web/
          retention-days: 14

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version label
        id: version
        run: |
          TAG=$(git tag --points-at HEAD | head -n1)
          if [ -n "$TAG" ]; then
            echo "label=$TAG" >> "$GITHUB_OUTPUT"
          else
            PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
            echo "label=${PUBSPEC_VERSION}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl git \
            libgtk-3-dev libblkid-dev \
            liblzma-dev libstdc++-12-dev \
            ninja-build pkg-config \
            libglib2.0-dev libwebkit2gtk-4.1-dev \
            libpulse-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: |
          if [ "${{ inputs.upgrade_lock }}" = "true" ]; then
            flutter pub upgrade flutter_webrtc
          else
            flutter pub get
          fi

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ steps.version.outputs.label }}
          path: build/linux/x64/release/bundle/
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version label
        id: version
        shell: bash
        run: |
          TAG=$(git tag --points-at HEAD | head -n1)
          if [ -n "$TAG" ]; then
            echo "label=$TAG" >> "$GITHUB_OUTPUT"
          else
            PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
            echo "label=${PUBSPEC_VERSION}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ steps.version.outputs.label }}
          path: build/windows/x64/runner/Release/
          retention-days: 14

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version label
        id: version
        run: |
          TAG=$(git tag --points-at HEAD | head -n1)
          if [ -n "$TAG" ]; then
            echo "label=$TAG" >> "$GITHUB_OUTPUT"
          else
            PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
            echo "label=${PUBSPEC_VERSION}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Debug APK — no signing key required.
      # To build a signed release APK, create a keystore, add the following
      # secrets to your repo, and replace the step below:
      #   ANDROID_KEYSTORE_BASE64  — base64-encoded .jks file
      #   ANDROID_KEY_ALIAS        — key alias
      #   ANDROID_KEY_PASSWORD     — key password
      #   ANDROID_STORE_PASSWORD   — store password
      #
      # Then decode the keystore and pass the signing config via:
      #   flutter build apk --release \
      #     --dart-define=KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks \
      #     ... (or configure key.properties in android/)
      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ steps.version.outputs.label }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
